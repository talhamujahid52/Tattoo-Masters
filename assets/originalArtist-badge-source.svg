<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Original Artist badge. Re-export: rsvg-convert -w 64/128/192 -> originalArtist.png/@2x/@3x -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
    <linearGradient id="metal" gradientUnits="userSpaceOnUse" x1="25" y1="20" x2="95" y2="100">
      <stop offset="0" stop-color="#FFE47E"/>
      <stop offset="0.4" stop-color="#F8C536"/>
      <stop offset="0.75" stop-color="#E6A31C"/>
      <stop offset="1" stop-color="#F7CF55"/>
    </linearGradient>
    <linearGradient id="ringMetal" gradientUnits="userSpaceOnUse" x1="10" y1="0" x2="110" y2="120">
      <stop offset="0" stop-color="#FFEA96"/>
      <stop offset="0.45" stop-color="#F3B42C"/>
      <stop offset="0.75" stop-color="#C68212"/>
      <stop offset="1" stop-color="#F4C44C"/>
    </linearGradient>
    <polygon id="star" points="60.00,25.50 70.10,35.60 84.40,35.60 84.40,49.90 94.50,60.00 84.40,70.10 84.40,84.40 70.10,84.40 60.00,94.50 49.90,84.40 35.60,84.40 35.60,70.10 25.50,60.00 35.60,49.90 35.60,35.60 49.90,35.60" stroke-linejoin="miter" stroke-miterlimit="10"/>
    <polyline id="check" points="47,59.5 55.5,68 73,50.5" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>
  <circle cx="60" cy="60" r="59.8" fill="#6E4508"/>
  <circle cx="60" cy="60" r="59.1" fill="url(#ringMetal)"/>
  <circle cx="60" cy="60" r="56.9" fill="none" stroke="#FFF6B8" stroke-width="1.3" opacity="0.9"/>
  <circle cx="60" cy="60" r="55.3" fill="#3A2200"/>
  <circle cx="60" cy="60" r="54.5" fill="#000"/>
  <circle cx="60" cy="60" r="54" fill="none" stroke="#9A5A00" stroke-width="1.6" opacity="0.4" filter="url(#glow)"/>
  <use href="#star" fill="none" stroke="#B86A00" stroke-width="7.2" opacity="0.55" filter="url(#glow)"/>
  <use href="#star" fill="none" stroke="#6A3C00" stroke-width="5.9"/>
  <use href="#star" fill="none" stroke="url(#metal)" stroke-width="5"/>
  <use href="#star" fill="none" stroke="#FFF6BC" stroke-width="1.60" opacity="0.9"/>
  <use href="#check" fill="none" stroke="#B86A00" stroke-width="8.2" opacity="0.55" filter="url(#glow)"/>
  <use href="#check" fill="none" stroke="#6A3C00" stroke-width="6.9"/>
  <use href="#check" fill="none" stroke="url(#metal)" stroke-width="6"/>
  <use href="#check" fill="none" stroke="#FFF6BC" stroke-width="1.92" opacity="0.9"/>
</svg>
